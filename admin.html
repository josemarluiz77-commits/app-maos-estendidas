<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin - Comunidade Mãos Estendidas</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:#fff;
text-align:center;
}

header{
background:#000;
padding:20px;
color:gold;
font-weight:bold;
}

.card{
background:#121212;
padding:18px;
margin:15px;
border-radius:12px;
text-align:left;
}

h2{
color:gold;
font-size:18px;
}

input, textarea, select{
width:100%;
padding:10px;
margin-top:8px;
background:#1c1c1c;
color:white;
border:none;
border-radius:8px;
outline:none;
}

button{
margin-top:10px;
padding:12px;
width:100%;
background:gold;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

button:hover{opacity:0.9;}

.excluir{
background:#8b0000;
color:white;
margin-top:6px;
}

.status{
margin:10px;
color:#aaa;
min-height:20px;
}
</style>
</head>

<body>

<script>
// 🔐 proteção simples (Fase 1)
let senha = prompt("Digite a senha do Painel Admin:");

if(senha !== "maosestendidas@2026"){
document.body.innerHTML = "<h1 style='color:red;margin-top:50px;'>Acesso negado</h1>";
throw new Error("Bloqueado");
}
</script>

<header>
PAINEL ADMIN
</header>

<div class="status" id="status"></div>

<!-- VERSÍCULO -->
<div class="card">
<h2>📖 Versículo do Dia</h2>
<input id="versiculoTexto" placeholder="Texto bíblico">
<input id="versiculoRef" placeholder="Referência">
<button onclick="salvarVersiculo()">Salvar</button>
</div>

<!-- ÁUDIO DO DIA -->
<div class="card">
<h2>🎧 Áudio do Dia</h2>
<input id="audioDia" placeholder="Link MP3">
<button onclick="salvarAudioDia()">Salvar</button>
</div>

<!-- VÍDEO -->
<div class="card">
<h2>📺 Vídeo do Dia</h2>
<input id="videoDia" placeholder="Link YouTube">
<button onclick="salvarVideoDia()">Salvar</button>
</div>

<!-- MENSAGEM -->
<div class="card">
<h2>💬 Mensagem do Dia</h2>
<textarea id="mensagemDia" placeholder="Escreva a mensagem"></textarea>
<button onclick="salvarMensagem()">Salvar</button>
</div>

<!-- ÁUDIO LISTA -->
<div class="card">
<h2>🎧 Adicionar Áudio na Biblioteca</h2>

<input id="tituloAudio" placeholder="Título">
<input id="linkAudio" placeholder="Link MP3">

<select id="tipoAudio">
<option value="pastor">Palavra do Pastor</option>
<option value="oracao">Oração</option>
<option value="devocional">Devocional</option>
<option value="campanha">Campanha</option>
</select>

<button onclick="adicionarAudio()">Adicionar</button>
</div>

<!-- LISTA -->
<div class="card">
<h2>📋 Áudios Cadastrados</h2>
<div id="listaAudios"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyChFlUeEs9OPtb8g-lhTiiNoDp_YegEI-s",
authDomain: "comunidademaosestendidas.firebaseapp.com",
databaseURL: "https://comunidademaosestendidas-default-rtdb.firebaseio.com",
projectId: "comunidademaosestendidas",
storageBucket: "comunidademaosestendidas.firebasestorage.app",
messagingSenderId: "115001016227",
appId: "1:115001016227:web:0df485d449944fea496416"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// STATUS
function setStatus(msg){
const el = document.getElementById("status");
el.innerText = msg;
setTimeout(()=> el.innerText = "", 3000);
}

/* 📖 VERSÍCULO */
function salvarVersiculo(){
const texto = document.getElementById("versiculoTexto").value;
const ref = document.getElementById("versiculoRef").value;

db.ref("versiculoDoDia").set({
texto,
referencia: ref,
data: Date.now()
});

setStatus("✔ Versículo salvo!");
}

/* 🎧 ÁUDIO DO DIA */
function salvarAudioDia(){
const url = document.getElementById("audioDia").value;

db.ref("audioDoDia").set({
url,
data: Date.now()
});

setStatus("✔ Áudio do dia salvo!");
}

/* 📺 VÍDEO */
function salvarVideoDia(){
let link = document.getElementById("videoDia").value;
let id = "";

if(link.includes("v=")){
id = link.split("v=")[1].split("&")[0];
}else if(link.includes("youtu.be/")){
id = link.split("youtu.be/")[1];
}else{
id = link;
}

db.ref("videoDoDia").set({
url:id,
data: Date.now()
});

setStatus("✔ Vídeo salvo!");
}

/* 💬 MENSAGEM */
function salvarMensagem(){
const msg = document.getElementById("mensagemDia").value;

db.ref("mensagemDoDia").set({
texto: msg,
data: Date.now()
});

setStatus("✔ Mensagem salva!");
}

/* 🎧 ADICIONAR ÁUDIO */
function adicionarAudio(){

const titulo = document.getElementById("tituloAudio").value;
const url = document.getElementById("linkAudio").value;
const tipo = document.getElementById("tipoAudio").value;

if(!titulo || !url){
setStatus("⚠ Preencha todos os campos");
return;
}

const novo = db.ref("audios").push();

novo.set({
titulo,
url,
tipo,
data: Date.now()
});

document.getElementById("tituloAudio").value = "";
document.getElementById("linkAudio").value = "";

setStatus("🔥 Áudio adicionado!");
}

/* 📋 LISTAR ÁUDIOS */
db.ref("audios").on("value", snap=>{

const lista = document.getElementById("listaAudios");
lista.innerHTML = "";

const dados = snap.val();

if(!dados){
lista.innerHTML = "<p style='color:#aaa'>Nenhum áudio cadastrado</p>";
return;
}

for(let id in dados){

const a = dados[id];

lista.innerHTML += `
<div style="padding:10px;border-bottom:1px solid #222">
<strong>${a.titulo}</strong> <br>
<small>${a.tipo}</small>

<button class="excluir" onclick="excluirAudio('${id}')">Excluir</button>
</div>
`;
}
});

/* ❌ EXCLUIR */
function excluirAudio(id){
if(confirm("Excluir este áudio?")){
db.ref("audios/"+id).remove();
setStatus("❌ Áudio removido");
}
}
</script>

</body>
</html>
