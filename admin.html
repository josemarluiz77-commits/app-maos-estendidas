<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Admin - Comunidade Mãos Estendidas</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:#fff;
text-align:center;
}

header{
background:#000;
padding:20px;
color:gold;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:999;
}

.header-title{
font-size:20px;
}

.logout-btn{
background:#8b0000;
color:white;
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
width:auto;
font-weight:bold;
}

.card{
background:#121212;
padding:18px;
margin:15px;
border-radius:12px;
text-align:left;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

h2{
color:gold;
font-size:18px;
margin-top:0;
}

input, textarea, select{
width:100%;
padding:12px;
margin-top:8px;
background:#1c1c1c;
color:white;
border:none;
border-radius:8px;
outline:none;
box-sizing:border-box;
font-size:14px;
}

textarea{
resize:vertical;
min-height:120px;
}

button{
margin-top:10px;
padding:12px;
width:100%;
background:gold;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
font-size:15px;
}

button:hover{
opacity:0.9;
}

.excluir{
background:#8b0000;
color:white;
margin-top:6px;
}

.status{
margin:10px;
color:#aaa;
min-height:20px;
font-weight:bold;
}

.audio-item{
padding:12px;
border-bottom:1px solid #222;
}

small{
color:#aaa;
}

</style>

</head>

<body>

<header>

<div class="header-title">
🔥 PAINEL ADMIN
</div>

<button class="logout-btn" onclick="logout()">
Sair
</button>

</header>

<div class="status" id="status"></div>

<!-- VERSÍCULO -->
<div class="card">

<h2>📖 Versículo do Dia</h2>

<input id="versiculoTexto" placeholder="Texto bíblico">

<input id="versiculoRef" placeholder="Referência">

<button onclick="salvarVersiculo()">
Salvar Versículo
</button>

</div>

<!-- ÁUDIO DO DIA -->
<div class="card">

<h2>🎧 Áudio do Dia</h2>

<input id="audioDia" placeholder="Link MP3">

<button onclick="salvarAudioDia()">
Salvar Áudio
</button>

</div>

<!-- VÍDEO -->
<div class="card">

<h2>📺 Vídeo do Dia</h2>

<input id="videoDia" placeholder="Link do YouTube">

<button onclick="salvarVideoDia()">
Salvar Vídeo
</button>

</div>

<!-- MENSAGEM -->
<div class="card">

<h2>💬 Mensagem do Dia</h2>

<textarea id="mensagemDia"
placeholder="Escreva a mensagem do dia"></textarea>

<button onclick="salvarMensagem()">
Salvar Mensagem
</button>

</div>

<!-- PALAVRA DO PASTOR -->
<div class="card">

<h2>📖 Palavra do Pastor</h2>

<input id="tituloPalavra"
placeholder="Título da Palavra">

<textarea id="textoPalavra"
placeholder="Escreva a Palavra do Pastor"
style="height:220px;"></textarea>

<button onclick="salvarPalavra()">
Publicar Palavra
</button>

</div>

<!-- ÁUDIO LISTA -->
<div class="card">

<h2>🎧 Adicionar Áudio na Biblioteca</h2>

<input id="tituloAudio"
placeholder="Título do áudio">

<input id="linkAudio"
placeholder="Link MP3 do Catbox">

<select id="tipoAudio">

<option value="pastor">
Palavra do Pastor
</option>

<option value="oracao">
Oração
</option>

<option value="devocional">
Devocional
</option>

<option value="campanha">
Campanha
</option>

</select>

<button onclick="adicionarAudio()">
Adicionar Áudio
</button>

</div>

<!-- LISTA DE ÁUDIOS -->
<div class="card">

<h2>📋 Áudios Cadastrados</h2>

<div id="listaAudios"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyChFlUeEs9OPtb8g-lhTiiNoDp_YegEI-s",

authDomain: "comunidademaosestendidas.firebaseapp.com",

databaseURL: "https://comunidademaosestendidas-default-rtdb.firebaseio.com",

projectId: "comunidademaosestendidas",

storageBucket: "comunidademaosestendidas.firebasestorage.app",

messagingSenderId: "115001016227",

appId: "1:115001016227:web:0df485d449944fea496416"

};

firebase.initializeApp(firebaseConfig);

firebase.auth().onAuthStateChanged(user => {

if(!user){

window.location.href = "./login.html";

}

});

const db = firebase.database();

/* STATUS */

function setStatus(msg){

const el = document.getElementById("status");

el.innerText = msg;

setTimeout(()=>{

el.innerText = "";

},3000);

}

/* VERSÍCULO */

function salvarVersiculo(){

db.ref("versiculoDoDia").set({

texto: document.getElementById("versiculoTexto").value,

referencia: document.getElementById("versiculoRef").value,

data: Date.now()

});

setStatus("✔ Versículo salvo!");

}

/* ÁUDIO DO DIA */

function salvarAudioDia(){

db.ref("audioDoDia").set({

url: document.getElementById("audioDia").value,

data: Date.now()

});

setStatus("✔ Áudio salvo!");

}

/* VÍDEO */

function salvarVideoDia(){

let link =
document.getElementById("videoDia").value;

let id = "";

if(link.includes("v=")){

id = link.split("v=")[1].split("&")[0];

}else if(link.includes("youtu.be/")){

id = link.split("youtu.be/")[1];

}else{

id = link;

}

db.ref("videoDoDia").set({

url:id,
data:Date.now()

});

setStatus("✔ Vídeo salvo!");

}

/* MENSAGEM */

function salvarMensagem(){

db.ref("mensagemDoDia").set({

texto: document.getElementById("mensagemDia").value,

data: Date.now()

});

setStatus("✔ Mensagem salva!");

}

/* PALAVRA DO PASTOR */

function salvarPalavra(){

db.ref("palavraPastor").set({

titulo:
document.getElementById("tituloPalavra").value,

texto:
document.getElementById("textoPalavra").value,

data: Date.now()

});

setStatus("🔥 Palavra publicada!");

}

/* ADICIONAR ÁUDIO */

function adicionarAudio(){

const titulo =
document.getElementById("tituloAudio").value;

const url =
document.getElementById("linkAudio").value;

const tipo =
document.getElementById("tipoAudio").value;

if(!titulo || !url){

setStatus("⚠ Preencha tudo");

return;

}

db.ref("audios").push({

titulo,
url,
tipo,
data:Date.now()

});

document.getElementById("tituloAudio").value = "";
document.getElementById("linkAudio").value = "";

setStatus("🔥 Áudio adicionado!");

}

/* LISTAR ÁUDIOS */

db.ref("audios").on("value", snap=>{

const lista =
document.getElementById("listaAudios");

lista.innerHTML = "";

const dados = snap.val();

if(!dados){

lista.innerHTML =
"<p style='color:#aaa'>Nenhum áudio cadastrado</p>";

return;

}

for(let id in dados){

const a = dados[id];

lista.innerHTML += `

<div class="audio-item">

<strong>${a.titulo}</strong><br>

<small>${a.tipo}</small>

<button class="excluir"
onclick="excluirAudio('${id}')">

Excluir

</button>

</div>

`;

}

});

/* EXCLUIR */

function excluirAudio(id){

if(confirm("Excluir áudio?")){

db.ref("audios/"+id).remove();

setStatus("❌ Áudio removido");

}

}

/* LOGOUT */

function logout(){

firebase.auth().signOut()

.then(()=>{

window.location.href = "./login.html";

});

}

</script>

</body>
</html>
