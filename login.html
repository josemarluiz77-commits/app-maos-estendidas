<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:#121212;
padding:35px;
border-radius:14px;
width:90%;
max-width:400px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h1{
text-align:center;
color:gold;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-top:10px;
background:#1d1d1d;
border:none;
border-radius:8px;
color:white;
box-sizing:border-box;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:18px;
background:gold;
border:none;
border-radius:8px;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#status{
margin-top:15px;
text-align:center;
color:#aaa;
}

</style>
</head>

<body>

<div class="box">

<h1>🔥 Login Admin</h1>

<input type="email"
id="email"
placeholder="Seu email">

<input type="password"
id="senha"
placeholder="Sua senha">

<button onclick="login()">
ENTRAR
</button>

<div id="status"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyChFlUeEs9OPtb8g-lhTiiNoDp_YegEI-s",

authDomain: "comunidademaosestendidas.firebaseapp.com",

databaseURL: "https://comunidademaosestendidas-default-rtdb.firebaseio.com",

projectId: "comunidademaosestendidas",

storageBucket: "comunidademaosestendidas.firebasestorage.app",

messagingSenderId: "115001016227",

appId: "1:115001016227:web:0df485d449944fea496416"

};

firebase.initializeApp(firebaseConfig);

function login(){

const email =
document.getElementById("email").value;

const senha =
document.getElementById("senha").value;

const status =
document.getElementById("status");

status.innerText = "Entrando...";

firebase.auth()
.signInWithEmailAndPassword(email, senha)

.then(()=>{

status.innerText = "Login realizado!";

window.location.href = "admin.html";

})

.catch((error)=>{

status.innerText =
"Erro: " + error.message;

});

}

</script>

</body>
</html>
