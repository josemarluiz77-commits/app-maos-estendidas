<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin - Comunidade Mãos Estendidas</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#08110c,#111a14);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.login-box{
background:#121212;
padding:35px;
border-radius:20px;
width:340px;
box-shadow:0 0 25px rgba(0,0,0,0.5);
}

h1{
text-align:center;
color:#d4af37;
margin-bottom:25px;
font-size:26px;
}

input{
width:100%;
padding:14px;
margin-top:12px;
background:#1c1c1c;
border:none;
border-radius:10px;
color:white;
font-size:15px;
box-sizing:border-box;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:18px;
background:linear-gradient(135deg,#1ebe5d,#0d8f45);
color:white;
border:none;
border-radius:10px;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:hover{
opacity:0.95;
}

#status{
margin-top:15px;
text-align:center;
color:#aaa;
min-height:20px;
}
</style>
</head>

<body>

<div class="login-box">

<h1>🔐 Painel Admin</h1>

<input type="email" id="email" placeholder="Seu email">
<input type="password" id="senha" placeholder="Sua senha">

<button onclick="login()">Entrar</button>

<div id="status"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyChFlUeEs9OPtb8g-lhTiiNoDp_YegEI-s",
authDomain: "comunidademaosestendidas.firebaseapp.com",
databaseURL: "https://comunidademaosestendidas-default-rtdb.firebaseio.com",
projectId: "comunidademaosestendidas",
storageBucket: "comunidademaosestendidas.firebasestorage.app",
messagingSenderId: "115001016227",
appId: "1:115001016227:web:0df485d449944fea496416"
};

firebase.initializeApp(firebaseConfig);

function login(){

const email = document.getElementById("email").value;
const senha = document.getElementById("senha").value;

firebase.auth().signInWithEmailAndPassword(email, senha)

.then(()=>{

document.getElementById("status").innerText = "✔ Login realizado";

setTimeout(()=>{
window.location.href = "admin.html";
},1000);

})

.catch((error)=>{

document.getElementById("status").innerText = "❌ Email ou senha inválidos";
console.log(error);

});

}
</script>

</body>
</html>
