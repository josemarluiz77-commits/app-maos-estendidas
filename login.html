<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#08110c,#111a14);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.login-box{
background:#121212;
padding:35px;
border-radius:20px;
width:340px;
box-shadow:0 0 25px rgba(0,0,0,0.5);
}

h1{
text-align:center;
color:#d4af37;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-top:12px;
background:#1c1c1c;
border:none;
border-radius:10px;
color:white;
font-size:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:18px;
background:linear-gradient(135deg,#1ebe5d,#0d8f45);
color:white;
border:none;
border-radius:10px;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:hover{
opacity:0.95;
}
</html>
